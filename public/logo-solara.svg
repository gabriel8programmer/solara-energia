<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" fill="none">
  <defs>
    <linearGradient id="logo-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD447"/>
      <stop offset="50%" stop-color="#FFAE00"/>
      <stop offset="100%" stop-color="#E68A00"/>
    </linearGradient>
    <linearGradient id="logo-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3778"/>
      <stop offset="100%" stop-color="#071A38"/>
    </linearGradient>
    <filter id="logo-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FFAE00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Mark / Symbol Container -->
  <g transform="translate(6, 8)">
    <rect width="48" height="48" rx="14" fill="url(#logo-blue)"/>
    <g filter="url(#logo-shadow)">
      <circle cx="24" cy="24" r="8" fill="url(#logo-gold)"/>
      <path d="M24 8 V12" stroke="url(#logo-gold)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M24 36 V40" stroke="url(#logo-gold)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M8 24 H12" stroke="url(#logo-gold)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M36 24 H40" stroke="url(#logo-gold)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M12.7 12.7 L15.7 15.7" stroke="url(#logo-gold)" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M32.3 32.3 L35.3 35.3" stroke="url(#logo-gold)" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M35.3 12.7 L32.3 15.7" stroke="url(#logo-gold)" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M15.7 32.3 L12.7 35.3" stroke="url(#logo-gold)" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="21" cy="21" r="2.2" fill="#FFFFFF" fill-opacity="0.8"/>
    </g>
  </g>

  <!-- Wordmark "Solara" -->
  <text x="66" y="38" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="26" fill="#0B2A5B" letter-spacing="-0.5">Solara</text>
  
  <!-- Submark "ENERGIA" -->
  <text x="160" y="38" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="600" font-size="16" fill="#F0A500" letter-spacing="1.2">ENERGIA</text>
</svg>
